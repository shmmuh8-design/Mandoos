<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المندوس</title>
<meta name="description" content="المندوس: سوق التراث والقطع القديمة في عُمان. خناجر، فضيات، أحجار كريمة، عملات، نحاسيات.">
<meta property="og:title" content="المندوس 🗝️ سوق التراث في عُمان">
<meta property="og:description" content="خناجر، فضيات، أحجار كريمة، عملات ونحاسيات. بِع واشترِ مباشرة بدون وسيط.">
<script src="config.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first souq. Sticky top (logo, search), category strip, المندوس banner, filters, then a 2-col listing grid; a listing opens in a bottom sheet with photos + call/SMS/WhatsApp. Copper on cool stone, deep ink text. */
:root{
  --bg:#f2f1ee; --surface:#ffffff; --sunk:#e8e6e1; --line:#d9d5cd; --fg:#1f1b17; --muted:#6b645b;
  --copper:#b0521c; --copper-ink:#ffffff; --copper-soft:#f6e6da; --palm:#2f6b4f; --palm-soft:#dfeee6; --wa:#1f9d55; --bad:#b4313b; --star:#d99a00;
  --display:"Alexandria","Noto Naskh Arabic",Tahoma,sans-serif;
  --body:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --r:16px; --shadow:0 1px 2px rgba(31,27,23,.06),0 8px 22px rgba(31,27,23,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14120f; --surface:#1e1b17; --sunk:#181512; --line:#332d27; --fg:#f1ece6; --muted:#a79e93;
  --copper:#e98a4f; --copper-ink:#1a1410; --copper-soft:#3a2518; --palm:#7cc4a0; --palm-soft:#1c3328; --wa:#3cc177; --bad:#f08890; --star:#f3c34a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14120f; --surface:#1e1b17; --sunk:#181512; --line:#332d27; --fg:#f1ece6; --muted:#a79e93;
  --copper:#e98a4f; --copper-ink:#1a1410; --copper-soft:#3a2518; --palm:#7cc4a0; --palm-soft:#1c3328; --wa:#3cc177; --bad:#f08890; --star:#f3c34a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:600 17px/1.65 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{display:flex;align-items:center;gap:8px;font:800 1.65rem/1 var(--display);color:var(--copper)}
.brand .logo svg{width:38px;height:38px}
.brand .sp{flex:1}
.demo{font:700 .7rem var(--display);background:var(--copper-soft);color:var(--copper);padding:3px 9px;border-radius:999px}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 11px;font-weight:700;font-size:.85rem;display:inline-flex;align-items:center;gap:5px}
.cnt:not(:empty){background:var(--copper);color:var(--copper-ink);border-radius:999px;padding:0 7px;font-size:.75rem}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;outline:none}

.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-top:4px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:78px;font-weight:700;font-size:.82rem;color:var(--muted)}
.cat b{font-size:1.5rem;line-height:1.3}
.cat[aria-pressed="true"]{border-color:var(--copper);color:var(--copper);background:var(--copper-soft)}

.mandoos{margin-top:14px;border-radius:20px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:linear-gradient(135deg,#3b2414,#6e3a17);color:#fbe9d8;box-shadow:var(--shadow)}
.mandoos h2{font:800 1.3rem/1.3 var(--display);color:#fff}
.mandoos p{margin:4px 0 0;font-size:.92rem;opacity:.9}
.mandoos button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#f2b46a;color:#2b170a}
.mandoos .art{font-size:3rem;line-height:1}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0;flex:1 1 120px}
.reshead{display:flex;align-items:baseline;gap:10px;margin:16px 0 10px}
.reshead h2{font:700 1.1rem var(--display);flex:1}
.reshead small{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:start;padding:0;position:relative}
.card .img{aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:block;width:100%;object-fit:cover}
.card .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .price{font:800 1.1rem var(--display);color:var(--copper)}
.card .t{font-weight:700;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .m{font-size:.76rem;color:var(--muted)}
.card .heart{position:absolute;top:8px;inset-inline-start:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#1f1b17;font-size:1rem;display:grid;place-items:center}
.card .heart.on{color:#d0343b}
.card .tag{position:absolute;top:8px;inset-inline-end:8px}
.pill{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.pill.palm{background:var(--palm-soft);color:var(--palm)}.pill.cop{background:var(--copper-soft);color:var(--copper)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);grid-column:1 / -1}

.fab{position:fixed;inset-inline-end:max(18px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;padding:14px 22px;background:var(--copper);color:var(--copper-ink);font:800 1.05rem var(--display);box-shadow:0 10px 24px rgba(0,0,0,.28);z-index:20}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(15,12,9,.55);display:grid;place-items:end center}
.sheet{background:var(--surface);width:min(640px,100%);max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font:800 1.25rem/1.4 var(--display)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:14px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center;border-radius:14px;background:var(--sunk)}
.bigprice{font:800 1.6rem var(--display);color:var(--copper)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.seller{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:14px;padding:10px 12px}
.seller .av{width:40px;height:40px;border-radius:50%;background:var(--palm);color:#fff;display:grid;place-items:center;font:800 1rem var(--display)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--copper);color:var(--copper-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.linkb{border:0;background:none;padding:4px 2px;color:var(--muted);font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
.links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;font-weight:700;color:var(--muted)}
.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea.inp{min-height:96px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--copper);color:var(--copper);background:var(--copper-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .th{position:relative;width:76px;height:76px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs .x{position:absolute;top:-6px;inset-inline-end:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:.8rem}
.addph{width:76px;height:76px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:1.6rem;cursor:pointer}
.end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:.8rem;color:var(--muted);margin:0}
footer{margin-top:28px;text-align:center;font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:90;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:420px){.row2{grid-template-columns:1fr}.mandoos{grid-template-columns:1fr}.mandoos .art{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" dir="rtl" lang="ar">
  <header class="head">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="currentColor"/><path d="M14 28c0-8 8-13 18-13s18 5 18 13z" fill="#fff" opacity=".9"/><rect x="14" y="28" width="36" height="22" rx="3" fill="#fff"/><path d="M14 36h36M24 28v22M40 28v22" stroke="currentColor" stroke-width="2.5"/><rect x="28" y="32" width="8" height="9" rx="2" fill="#e0a43a"/><circle cx="32" cy="36" r="1.6" fill="currentColor"/></svg>المندوس</div>
      <span class="sp"></span>
      <button class="ib" id="favBtn" type="button">♡ مفضلتي <span class="cnt num" id="favN"></span></button>
      <button class="ib" id="mineBtn" type="button">📋 إعلاناتي</button>
      <button class="ib" id="shareApp" type="button" aria-label="شارك المندوس">📤 شارك</button>
    </div>
    <div class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" placeholder="دوّر: خنجر، زمرد، مندوس…" aria-label="بحث"></div>
  </header>

  <div class="cats" id="cats" role="group" aria-label="الأقسام"></div>

  <section class="mandoos" id="mandoosBanner">
    <div><h2>🪵 كنوز من بيوت عُمان</h2><p>خناجر وفضيات وأحجار كريمة وعملات ونحاسيات، وكل شي قديم له قصة. بِع واشترِ مباشرة بدون وسيط.</p><p style="font-size:.82rem;margin-top:8px;opacity:.8">⚠️ يُمنع بيع القطع الأثرية المحمية بالقانون.</p></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span class="art" aria-hidden="true">🗝️</span><button type="button" id="goMandoos">＋ اعرض قطعتك</button></div>
  </section>

  <div class="filters">
    <select class="sel" id="gov" aria-label="المحافظة"></select>
    <select class="sel" id="area" aria-label="الولاية"></select>
    <select class="sel" id="sort" aria-label="الترتيب"><option value="new">الأحدث</option><option value="low">الأرخص</option><option value="high">الأغلى</option></select>

  <div class="reshead"><h2 id="resTitle">كل الإعلانات</h2><small id="resN" class="num"></small></div>
  <div class="grid" id="grid"></div>

  <div style="display:flex;justify-content:center;margin-top:16px"><button class="btn ghost" type="button" id="moreBtn" hidden>عرض المزيد</button></div>
  <footer>المندوس · سلطنة عُمان · © سالم الجابري · <a href="mailto:design.omani1@gmail.com" style="color:inherit" dir="ltr">design.omani1@gmail.com</a><br><a href="privacy.html" style="color:inherit">الخصوصية والشروط</a></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const el = (t, a = {}, ...k) => { const e = document.createElement(t); for(const [x, v] of Object.entries(a)){ if(x === 'class') e.className = v; else if(x === 'text') e.textContent = v; else if(x.startsWith('on')) e[x] = v; else if(v !== false && v != null) e.setAttribute(x, v === true ? '' : v); } k.flat().forEach(c => c != null && e.append(c)); return e; };
const LS = { get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2800); }
const digits = v => String(v || '').replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c));
const normPhone = p => { let d = digits(p).replace(/\D/g, ''); if(d.startsWith('00')) d = d.slice(2); if(/^[79]\d{7}$/.test(d)) d = '968' + d; return d; };
const fmtPrice = n => +n ? (+n).toLocaleString('en', { maximumFractionDigits:3 }) + ' ر.ع' : 'مجانًا';
function ago(ts){ const m = Math.round((Date.now() - new Date(ts)) / 6e4); if(m < 60) return 'قبل ' + Math.max(1, m) + ' دقيقة'; const h = Math.round(m / 60); if(h < 24) return 'قبل ' + h + ' ساعة'; const d = Math.round(h / 24); return d === 1 ? 'أمس' : 'قبل ' + d + ' يوم'; }
const Cap = window.Capacitor, NATIVE = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const CONTACT = window.AR_CONTACT || 'design.omani1@gmail.com';

const GOV = {"مسقط": ["مسقط", "مطرح", "بوشر", "السيب", "العامرات", "قريات"], "ظفار": ["صلالة", "طاقة", "مرباط", "رخيوت", "ثمريت", "ضلكوت", "المزيونة", "مقشن", "شليم وجزر الحلانيات", "سدح"], "مسندم": ["خصب", "دبا", "بخا", "مدحاء"], "البريمي": ["البريمي", "محضة", "السنينة"], "الداخلية": ["نزوى", "بهلاء", "منح", "الحمراء", "أدم", "إزكي", "سمائل", "بدبد", "الجبل الأخضر"], "شمال الباطنة": ["صحار", "شناص", "لوى", "صحم", "الخابورة", "السويق"], "جنوب الباطنة": ["الرستاق", "العوابي", "نخل", "وادي المعاول", "بركاء", "المصنعة"], "جنوب الشرقية": ["صور", "الكامل والوافي", "جعلان بني بو حسن", "جعلان بني بو علي", "مصيرة"], "شمال الشرقية": ["إبراء", "المضيبي", "بدية", "القابل", "وادي بني خالد", "دماء والطائيين"], "الظاهرة": ["عبري", "ينقل", "ضنك"], "الوسطى": ["هيماء", "محوت", "الدقم", "الجازر"]};
const CATS = [ ['all','🗝️','الكل'], ['khanjar','🗡️','خناجر وسيوف'], ['silver','💍','فضيات وحُلي'], ['gems','💎','أحجار كريمة'], ['coins','🪙','عملات وطوابع'], ['brass','🏺','نحاسيات وفخار'], ['wood','🚪','خشبيات ومناديس'], ['vintage','📻','راديوهات وساعات'], ['books','📚','كتب وصور قديمة'], ['cars','🚗','سيارات كلاسيكية'], ['misc','🧺','متفرقات تراثية'] ];
const catName = id => (CATS.find(c => c[0] === id) || [, , ''])[2];
const COND = [ ['excellent','ممتازة'], ['good','جيدة'], ['worn','عليها أثر الزمن'], ['restored','مرمّمة'], ['needs','تحتاج ترميم'] ];
const condName = id => (COND.find(c => c[0] === id) || [, ''])[1];

/* ---------------- Supabase ---------------- */
const SB = window.AR_SB || {};
async function rpc(fn, args){
  let r;
  try{ r = await fetch(SB.url + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SB.key, 'Content-Type':'application/json' }, body:JSON.stringify(args || {}) }); }
  catch(e){ throw new Error('ما فيه اتصال بالإنترنت، حاول مرة ثانية'); }
  const t = await r.text(); let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok) throw new Error((j && j.message) || 'صار خطأ، حاول مرة ثانية');
  return j;
}
const photoUrl = p => /^(data:|https?:)/.test(p) ? p : SB.url + '/storage/v1/object/public/arsa/' + p;
const rid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));
async function upload(blob){
  const path = 'ads/' + rid() + '.jpg', url = SB.url + '/storage/v1/object/arsa/' + path;
  const go = h => fetch(url, { method:'POST', headers:Object.assign({ apikey:SB.key, 'Content-Type':'image/jpeg', 'x-upsert':'false' }, h), body:blob });
  let r = await go({});
  if(!r.ok && (r.status === 400 || r.status === 401 || r.status === 403)) r = await go({ Authorization:'Bearer ' + SB.key });
  if(!r.ok) throw new Error('ما قدرت أرفع الصورة (' + r.status + ')');
  return path;
}

/* ---------------- state ---------------- */
let FAV = LS.get('arsa-fav2', []);        // ad snapshots
let HIDDEN = new Set(LS.get('arsa-hidden', []));
let ME = LS.get('arsa-me', null);           // { phone, code }
const S = Object.assign({ cat:'all', gov:'', area:'', sort:'new' }, LS.get('arsa-s', {}), { q:'' });
const saveS = () => LS.set('arsa-s', { cat:S.cat, gov:S.gov, area:S.area, sort:S.sort });
let ADS = [], LOADING = false, MORE = false, ERR = '', reqN = 0;
const PAGE = 40;
async function load(reset = true){
  const n = ++reqN; LOADING = true; if(reset){ ADS = []; drawGrid(); }
  try{
    const rows = await rpc('ar_list', { p_cat:S.cat, p_gov:S.gov, p_area:S.area, p_q:S.q.trim(), p_sort:S.sort, p_limit:PAGE, p_offset:reset ? 0 : ADS.length });
    if(n !== reqN) return;
    ADS = reset ? rows : ADS.concat(rows); MORE = rows.length === PAGE; ERR = '';
  }catch(e){ if(n === reqN) ERR = e.message; }
  if(n === reqN){ LOADING = false; drawGrid(); }
}

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const m = 1100, s = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('bad')), 'image/jpeg', .75); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

    // photos: {path} already uploaded, or {blob, url} new
    let photos = edit ? edit.photos.map(p => ({ path:p, url:photoUrl(p) })) : [];
    const I = (id, ph, extra = {}) => el('input', { class:'inp', id, placeholder:ph, ...extra });
    const title = I('sTitle', 'مثال: كنبة 3 مقاعد نظيفة', { maxlength:70, value:d.title || '' });
    const price = I('sPrice', 'بالريال العماني (0 = مجانًا)', { inputmode:'decimal', dir:'ltr', value:d.price != null ? +d.price || '' : '' });
    const desc = el('textarea', { class:'inp', id:'sDesc', placeholder:'الحالة، المقاس، سبب البيع، العيوب إن وجدت…', maxlength:1000 }); desc.value = d.descr || '';
    const gov = el('select', { class:'inp', id:'sGov' }, Object.keys(GOV).map(g => el('option', { value:g, text:g, selected:g === (d.gov || S.gov || 'مسقط') })));
    const area = el('select', { class:'inp', id:'sArea' });
    const fillArea = () => area.replaceChildren(...GOV[gov.value].map(a => el('option', { value:a, text:a, selected:a === (d.area || S.area) })));
    gov.onchange = fillArea; fillArea();
    const catBox = el('div', { class:'chips' }), condBox = el('div', { class:'chips' });
    const drawC = () => { catBox.replaceChildren(...CATS.slice(1).map(([id, ic, n]) => el('button', { class:'chip', type:'button', 'aria-pressed':String(cat === id), text:ic + ' ' + n, onclick:() => { cat = id; drawC(); } }))); condBox.replaceChildren(...COND.map(([id, n]) => el('button', { class:'chip', type:'button', 'aria-pressed':String(cond === id), text:n, onclick:() => { cond = id; drawC(); } }))); };
    drawC();
    const thumbs = el('div', { class:'thumbs' }), file = el('input', { type:'file', accept:'image/*', multiple:true, id:'sFile', hidden:true });
    const drawTh = () => { thumbs.replaceChildren(...photos.map((p, i) => el('div', { class:'th' }, el('img', { src:p.url, alt:'صورة ' + (i + 1) }), el('button', { class:'x', type:'button', 'aria-label':'شيل الصورة', text:'✕', onclick:() => { photos.splice(i, 1); drawTh(); } }))), photos.length < 6 ? el('label', { class:'addph', for:'sFile', 'aria-label':'أضف صور', text:'📷' }) : null); };
    file.onchange = async () => { for(const f of [...file.files].slice(0, 6 - photos.length)){ try{ const blob = await shrink(f); photos.push({ blob, url:URL.createObjectURL(blob) }); }catch(e){ toast('صورة ما انقرت'); } } file.value = ''; drawTh(); };
    drawTh();
    const keepDraft = () => { if(!edit) LS.set('arsa-draft', { title:title.value, price:price.value, descr:desc.value, cat, cond, gov:gov.value, area:area.value }); };
    [title, price, desc].forEach(x => x.addEventListener('input', keepDraft));
    const go = el('button', { class:'btn', type:'button', text:edit ? 'احفظ التعديل' : 'انشر الإعلان' });
    b.append(el('h3', { text:edit ? '✏️ تعديل الإعلان' : '＋ اعرض قطعتك في المندوس' }),
      el('div', { class:'field' }, el('label', { text:'الصور (لين 6)' }), thumbs, file, el('p', { class:'hint', text:'الصورة الأولى هي اللي تطلع في القائمة. صوّر الغرض الحقيقي في مكان فيه نور.' })),
      fld('العنوان', title),
      el('div', { class:'field' }, el('label', { text:'القسم' }), catBox),
      el('div', { class:'row2' }, fld('السعر (ر.ع)', price), el('div', { class:'field' }, el('label', { text:'الحالة' }), condBox)),
      el('div', { class:'row2' }, fld('المحافظة', gov), fld('الولاية', area)),
      fld('الوصف', desc),
      el('p', { class:'hint', text:'ممنوع: الأغراض المسروقة أو الممنوعة قانونيًا، والأسلحة، والأدوية، والحيوانات المهددة، والصور مو الحقيقية.' }),
      el('div', { class:'end' }, el('button', { class:'btn ghost', type:'button', text:'إلغاء', onclick:close }), go));
    go.onclick = async () => {
      const pr = price.value.trim() === '' ? 0 : parseFloat(digits(price.value));
      if(!photos.length) return toast('أضف صورة وحدة على الأقل');
      if(title.value.trim().length < 3) return toast('اكتب عنوان واضح');
      if(!(pr >= 0)) return toast('اكتب السعر بالأرقام');
      go.disabled = true; go.textContent = 'أرفع الصور…';
      try{
        const paths = [];
        for(const [i, p] of photos.entries()){ go.textContent = 'أرفع الصور… ' + (i + 1) + '/' + photos.length; paths.push(p.path || (p.path = await upload(p.blob))); }
        go.textContent = 'أنشر…';
        const res = await rpc('ar_post', { p_phone:ME.phone, p_code:ME.code, p_id:edit ? edit.id : null, p_title:title.value.trim(), p_cat:cat, p_price:pr, p_cond:cond, p_gov:gov.value, p_area:area.value, p_descr:desc.value.trim(), p_photos:paths });
        if(!edit) LS.set('arsa-draft', {});
        close(); toast(edit ? 'انحفظ التعديل ✅' : 'انتشر إعلانك ✅'); S.cat = 'all'; S.gov = ''; S.area = ''; S.q = ''; $('q').value = ''; saveS(); drawCats(); drawGov(); load(true);
        if(!edit && res && res.id) setTimeout(() => sharePrompt({ id:res.id, title:title.value.trim(), price:pr, area:area.value }), 2200);
      }catch(e){ toast(e.message); go.disabled = false; go.textContent = edit ? 'احفظ التعديل' : 'انشر الإعلان'; }
    };
  });
}
$('sellBtn').onclick = () => sell(null);

drawCats(); drawGov(); drawCounts(); load(true);
$('shareApp').onclick = () => shareKit({ title:'شارك المندوس', text:'🗝️ المندوس: سوق التراث والقطع القديمة في عُمان. خناجر، فضيات، أحجار كريمة، عملات ونحاسيات. بِع واشترِ مباشرة بدون وسيط 👇', url:SITE });
(async () => { const id = new URLSearchParams(location.search).get('ad'); if(!/^[0-9a-f-]{36}$/i.test(id || '')) return; try{ const r = await rpc('ar_get', { p_id:id }); if(r && r[0]) openAd(r[0]); else toast('الإعلان انتهى أو انحذف'); }catch(e){} })();
</script>

<style>
.shk-scrim{position:fixed;inset:0;z-index:9990;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center}
.shk{width:min(560px,100%);background:#fff;color:#16181d;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));font-family:inherit;direction:rtl;animation:shkUp .22s ease-out}
@keyframes shkUp{from{transform:translateY(40px);opacity:0}}
.shk h3{margin:0 0 4px;font-size:1.1rem;font-weight:800}
.shk p{margin:0 0 14px;font-size:.88rem;color:#5d636e;overflow-wrap:anywhere}
.shk-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
.shk-g button{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:.8rem;font-weight:700;color:inherit;cursor:pointer}
.shk-g i{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff}
.shk-g i svg{width:28px;height:28px}
.shk-x{margin-top:16px;width:100%;border:1px solid #d8dbe0;background:none;border-radius:14px;padding:12px;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.shk-t{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16181d;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:9999;max-width:calc(100% - 32px);text-align:center;font-family:inherit}
@media (prefers-color-scheme:dark){.shk{background:#1c1f25;color:#eef0f3}.shk p{color:#a2a8b3}.shk-x{border-color:#3a3f48}.shk-t{background:#eef0f3;color:#16181d}}
</style>
<script>
(function(){
  const I = {
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>',
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
    sc:'<svg viewBox="0 0 24 24" fill="#fff" stroke="#16181d" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3c3 0 5 2.2 5 5.2v2.3l1.6-.5c.6 0 .8.6.3.9l-1.8.9c.6 1.6 1.8 2.8 3.4 3.3.4.1.4.6 0 .8-.7.3-1.5.4-2 .6-.2.4-.2 1-.5 1.1-.7.1-1.5-.3-2.6 0-1 .4-1.8 1.4-3.4 1.4s-2.4-1-3.4-1.4c-1.1-.3-1.9.1-2.6 0-.3-.1-.3-.7-.5-1.1-.5-.2-1.3-.3-2-.6-.4-.2-.4-.7 0-.8 1.6-.5 2.8-1.7 3.4-3.3l-1.8-.9c-.5-.3-.3-.9.3-.9l1.6.5V8.2C7 5.2 9 3 12 3Z"/></svg>',
    fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8.5c0-.3.2-.5.5-.5Z"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.7 8 10.3h-6.3l-4.9-6.3L5.3 21H2.2l7.3-8.3L1.8 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z"/></svg>',
    cp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
    more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>'
  };
  const B = [
    ['wa','واتساب','#25d366'], ['ig','إنستقرام','linear-gradient(45deg,#f9a825,#e1306c 50%,#833ab4)'], ['sc','سناب شات','#fffc00'],
    ['fb','فيسبوك','#1877f2'], ['x','X تويتر','#000'], ['cp','نسخ الرابط','#6b7280'], ['more','المزيد','#3b82f6']
  ];
  function toast(m){ const t = document.createElement('div'); t.className = 'shk-t'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 3200); }
  function copy(s){ return (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).catch(() => { const a = document.createElement('textarea'); a.value = s; document.body.append(a); a.select(); try{ document.execCommand('copy'); }catch(e){} a.remove(); }); }
  function go(u){ const w = window.open(u, '_blank', 'noopener'); if(!w) location.href = u; }
  window.shareKit = function(o){
    const url = o.url, text = o.text || '', full = text + (url ? '\n' + url : ''), E = encodeURIComponent;
    const s = document.createElement('div'); s.className = 'shk-scrim';
    const k = document.createElement('div'); k.className = 'shk'; k.setAttribute('role', 'dialog');
    const h = document.createElement('h3'); h.textContent = '📤 ' + (o.title || 'مشاركة');
    const p = document.createElement('p'); p.textContent = full;
    const g = document.createElement('div'); g.className = 'shk-g';
    B.forEach(([id, n, bg]) => {
      if(id === 'more' && !navigator.share) return;
      const b = document.createElement('button'); b.type = 'button';
      b.innerHTML = '<i style="background:' + bg + (id === 'sc' ? ';color:#16181d' : '') + '">' + I[id] + '</i>';
      b.append(n);
      b.onclick = () => {
        if(id === 'wa') go('https://wa.me/?text=' + E(full));
        else if(id === 'fb') go('https://www.facebook.com/sharer/sharer.php?u=' + E(url) + '&quote=' + E(text));
        else if(id === 'x') go('https://x.com/intent/post?text=' + E(text) + '&url=' + E(url));
        else if(id === 'sc') go('https://www.snapchat.com/scan?attachmentUrl=' + E(url));
        else if(id === 'ig'){ copy(full).then(() => { toast('انسخ الرابط ✅ الصقه في الستوري أو الرسالة بإنستقرام'); setTimeout(() => go('https://www.instagram.com/'), 1200); }); }
        else if(id === 'cp'){ copy(full).then(() => toast('انسخ الرابط ✅')); }
        else if(id === 'more'){ navigator.share({ title:o.title, text, url }).catch(() => {}); }
        if(id !== 'ig') s.remove(); else setTimeout(() => s.remove(), 1200);
      };
      g.append(b);
    });
    const x = document.createElement('button'); x.className = 'shk-x'; x.type = 'button'; x.textContent = 'إغلاق'; x.onclick = () => s.remove();
    s.onclick = e => { if(e.target === s) s.remove(); };
    k.append(h, p, g, x); s.append(k); document.body.append(s);
  };
})();
</script>
